# Local hooks that mirror the CI gates. Install with:
#   pip install -r requirements-dev.txt
#   pre-commit install
#
# The Gitleaks hook uses a binary on PATH. See SECURITY.md for installation
# options. Run `gitleaks git` separately to scan full history.

repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
